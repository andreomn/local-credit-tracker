# Cloud Build configuration for building and deploying existing Cloud Run Jobs.
#
# This file intentionally uses fixed project, region, image, and job names so it
# works unchanged from both:
#   gcloud builds submit --config cloudbuild.jobs.yaml .
# and a GitHub-connected Cloud Build trigger on main.
#
# The deploy steps only run `gcloud run jobs update --image ...` against existing
# Cloud Run Jobs. They do not create jobs, touch Scheduler, or change existing
# job settings such as environment variables, memory, CPU, retries, timeout, or
# service account.
steps:
  - id: build-anbima-download-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/anbima-to-gcs:latest
      - jobs/anbima-to-gcs

  - id: build-b3-predi-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/b3-predi-job:latest
      - jobs/b3-predi-to-gcs

  - id: build-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/b3-trades-job:latest
      - jobs/b3-trades-to-gcs

  - id: push-anbima-download-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/anbima-to-gcs:latest
    waitFor:
      - build-anbima-download-job

  - id: push-b3-predi-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/b3-predi-job:latest
    waitFor:
      - build-b3-predi-job

  - id: push-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/b3-trades-job:latest
    waitFor:
      - build-b3-trades-job

  - id: deploy-anbima-download-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - anbima-download-job
      - --image
      - gcr.io/debenture-tracker/anbima-to-gcs:latest
      - --region
      - southamerica-east1
      - --project
      - debenture-tracker
    waitFor:
      - push-anbima-download-job

  - id: deploy-b3-predi-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - b3-predi-job
      - --image
      - gcr.io/debenture-tracker/b3-predi-job:latest
      - --region
      - southamerica-east1
      - --project
      - debenture-tracker
    waitFor:
      - push-b3-predi-job

  - id: deploy-b3-trades-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - b3-trades-job
      - --image
      - gcr.io/debenture-tracker/b3-trades-job:latest
      - --region
      - southamerica-east1
      - --project
      - debenture-tracker
    waitFor:
      - push-b3-trades-job

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

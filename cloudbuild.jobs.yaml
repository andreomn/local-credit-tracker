# Cloud Build configuration for building and deploying existing Cloud Run Jobs.
#
# This file is intended to be executed by a GitHub-connected Cloud Build trigger
# that matches only pushes to the main branch. Each image is built with the fixed
# :latest tag required by the production Cloud Run Jobs. Cloud Run Jobs are
# updated in place with only the new image reference, preserving the existing job
# configuration (memory, CPU, retries, timeout, service account, and environment
# variables).
# No substitutions are required; this file works as-is with
# `gcloud builds submit --config cloudbuild.jobs.yaml .` and with the GitHub trigger.
steps:
  - id: build-anbima-download-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/anbima-to-gcs:latest
      - jobs/anbima-to-gcs

  - id: build-b3-predi-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/${_IMAGE_PROJECT_ID}/${_B3_PREDI_IMAGE}:${SHORT_SHA}
      - --tag
      - gcr.io/${_IMAGE_PROJECT_ID}/${_B3_PREDI_IMAGE}:latest
      - jobs/b3-predi-to-gcs

  - id: build-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/${_IMAGE_PROJECT_ID}/${_B3_TRADES_IMAGE}:${SHORT_SHA}
      - --tag
      - gcr.io/${_IMAGE_PROJECT_ID}/${_B3_TRADES_IMAGE}:latest
      - jobs/b3-trades-to-gcs

  - id: push-anbima-download-job-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/anbima-to-gcs:latest
    waitFor:
      - build-anbima-download-job

  - id: push-anbima-download-job-latest
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - jobs
      - update
      - anbima-download-job
      - --image
      - gcr.io/debenture-tracker/anbima-to-gcs:latest
      - --region
      - southamerica-east1
      - --project
      - debenture-tracker
    waitFor:
      - build-anbima-download-job

  - id: push-b3-predi-job-sha
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/b3-predi-job:latest
      - jobs/b3-predi-to-gcs

  - id: push-b3-predi-job-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/b3-predi-job:latest
    waitFor:
      - build-b3-predi-job

  - id: push-b3-trades-job-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/${_IMAGE_PROJECT_ID}/${_B3_TRADES_IMAGE}:${SHORT_SHA}
    waitFor:
      - build-b3-trades-job

  - id: push-b3-trades-job-latest
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/${_IMAGE_PROJECT_ID}/${_B3_TRADES_IMAGE}:latest
    waitFor:
      - build-b3-trades-job

  - id: deploy-anbima-download-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_ANBIMA_JOB}
      - --image
      - gcr.io/debenture-tracker/b3-predi-job:latest
      - --region
      - southamerica-east1
      - --project
      - debenture-tracker
    waitFor:
      - push-anbima-download-job-sha
      - push-anbima-download-job-latest

  - id: build-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/b3-trades-job:latest
      - jobs/b3-trades-to-gcs

  - id: push-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/b3-trades-job:latest
    waitFor:
      - push-b3-predi-job-sha
      - push-b3-predi-job-latest

  - id: deploy-b3-trades-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_B3_TRADES_JOB}
      - --image
      - gcr.io/debenture-tracker/b3-trades-job:latest
      - --region
      - southamerica-east1
      - --project
      - debenture-tracker
    waitFor:
      - push-b3-trades-job-sha
      - push-b3-trades-job-latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

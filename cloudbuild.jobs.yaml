# Cloud Build configuration for building and deploying Cloud Run Jobs.
#
# Each job is built from its repository subdirectory, pushed to Container
# Registry, and then the existing Cloud Run Job is updated to reference the new
# image. The `gcloud run jobs update --image` command intentionally changes only
# the container image so existing job configuration is preserved.
steps:
  - id: build-anbima-download-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/anbima-to-gcs:$COMMIT_SHA
      - jobs/anbima-to-gcs

  - id: push-anbima-download-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/anbima-to-gcs:$COMMIT_SHA
    waitFor:
      - build-anbima-download-job

  - id: deploy-anbima-download-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - anbima-download-job
      - --image
      - gcr.io/debenture-tracker/anbima-to-gcs:$COMMIT_SHA
      - --region
      - southamerica-east1
    waitFor:
      - push-anbima-download-job

  - id: build-b3-predi-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/b3-predi-to-gcs:$COMMIT_SHA
      - jobs/b3-predi-to-gcs

  - id: push-b3-predi-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/b3-predi-to-gcs:$COMMIT_SHA
    waitFor:
      - build-b3-predi-job

  - id: deploy-b3-predi-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - b3-predi-job
      - --image
      - gcr.io/debenture-tracker/b3-predi-to-gcs:$COMMIT_SHA
      - --region
      - southamerica-east1
    waitFor:
      - push-b3-predi-job

  - id: build-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/debenture-tracker/b3-trades-to-gcs:$COMMIT_SHA
      - jobs/b3-trades-to-gcs

  - id: push-b3-trades-job
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/debenture-tracker/b3-trades-to-gcs:$COMMIT_SHA
    waitFor:
      - build-b3-trades-job

  - id: deploy-b3-trades-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - b3-trades-job
      - --image
      - gcr.io/debenture-tracker/b3-trades-to-gcs:$COMMIT_SHA
      - --region
      - southamerica-east1
    waitFor:
      - push-b3-trades-job

images:
  - gcr.io/debenture-tracker/anbima-to-gcs:$COMMIT_SHA
  - gcr.io/debenture-tracker/b3-predi-to-gcs:$COMMIT_SHA
  - gcr.io/debenture-tracker/b3-trades-to-gcs:$COMMIT_SHA

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Local Credit Tracker{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    nav a { margin-right: 12px; text-decoration: none; color: #0b3b8f; font-weight: 600; }
    .card { border:1px solid #ddd; border-radius:8px; padding:16px; margin-top:16px; }
    input, select, button { padding: 8px; margin-right: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Local Credit Tracker</h1>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/debentures">Debêntures</a>
    <a href="/trades-page">Trades B3</a>
    <a href="/cvm-page">CVM Filings</a>
    <a href="/">Página legada</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>

{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="card">
  <h2>Top 30 (CDI/IPCA/Preço)</h2>
  <p id="ref" class="muted">Carregando...</p>
</div>

<div class="grid">
  <div class="card">
    <h3>Top CDI Spread</h3>
    <div class="table-wrap"><table id="tbl-cdi"></table></div>
  </div>
  <div class="card">
    <h3>Top IPCA Spread</h3>
    <div class="table-wrap"><table id="tbl-ipca"></table></div>
  </div>
</div>

<div class="card">
  <h3>Menor preço (BRL cents)</h3>
  <div class="table-wrap"><table id="tbl-brl"></table></div>
</div>

<script>
function fmt(v, d=2){ return (v===null || v===undefined || v==='') ? '-' : Number(v).toFixed(d); }
function renderTable(el, rows, cols){
  const head = '<thead><tr>' + cols.map(c => `<th>${c.label}</th>`).join('') + '</tr></thead>';
  const body = '<tbody>' + rows.map(r => '<tr>' + cols.map(c => `<td>${c.format ? c.format(r[c.key], r) : (r[c.key] ?? '-')}</td>`).join('') + '</tr>').join('') + '</tbody>';
  el.innerHTML = head + body;
}

fetch('/tables').then(r=>r.json()).then(data=>{
  document.getElementById('ref').innerText = 'Data de referência: ' + (data.reference_date || '-');
  const commonCols = [
    {key:'code', label:'Ticker'},
    {key:'issuer', label:'Emissor'},
    {key:'maturity_date', label:'Vencimento'},
    {key:'taxa_indicativa', label:'Taxa', format:v=>fmt(v,2)},
    {key:'wow_spread_bps', label:'WoW bps', format:v=>fmt(v,1)},
    {key:'wow_change_pct', label:'WoW %', format:v=>fmt(v,2)},
  ];
  renderTable(document.getElementById('tbl-cdi'), data.top_cdi_spread || [], commonCols);
  renderTable(document.getElementById('tbl-ipca'), data.top_ipca_spread || [], commonCols);
  renderTable(document.getElementById('tbl-brl'), data.bottom_brl_cents || [], [
    {key:'code', label:'Ticker'},
    {key:'issuer', label:'Emissor'},
    {key:'index', label:'Índice'},
    {key:'brl_cents', label:'Preço', format:v=>fmt(v,4)},
    {key:'maturity_date', label:'Vencimento'},
    {key:'wow_change_pct', label:'WoW %', format:v=>fmt(v,2)}
  ]);
}).catch(err=>{
  document.getElementById('ref').innerText = 'Erro ao carregar dashboard';
  console.error(err);
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Trades B3{% endblock %}
{% block content %}
<div class="card">
  <h2>Trades por ticker</h2>
  <input id="code" placeholder="Ex: AELP19" />
  <button onclick="run()">Buscar</button>
  <pre id="out"></pre>
</div>
<script>
function run(){
  const code = document.getElementById('code').value.trim();
  fetch('/trades?code=' + encodeURIComponent(code)).then(r=>r.json()).then(data=>{
    document.getElementById('out').innerText = JSON.stringify(data, null, 2);
  });
}
</script>
{% endblock %}
